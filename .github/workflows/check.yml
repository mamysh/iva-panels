name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: mamysh/iva-bitrix24
          ref: 60d690eeb302f951178d255fc687abbce4c020a9
          path: compat-bitrix
          persist-credentials: false
      - run: node scripts/check-settings.ts compat-bitrix/plugin
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/check-panel.ts examples/notes
      - run: node scripts/check-panel.ts examples/dynamic-notes
      - run: bash -n plugin/sh.iva/services/router/launch.sh

  bridge:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        core:
          [
            3ad563e42f4aec9d9b1cee8ab93026bf4c834288,
            5cf8f1963c8297e244655fa4f3dc6f1764030283,
            fa5586557f41c3397e8068f1a994eb820606d35a,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: smixs/iva-agent
          ref: ${{ matrix.core }}
          path: compat-core
          persist-credentials: false
      - run: npm ci
        working-directory: compat-core
      - uses: actions/checkout@v4
        with:
          repository: mamysh/iva-bitrix24
          ref: 60d690eeb302f951178d255fc687abbce4c020a9
          path: compat-bitrix
          persist-credentials: false
      - run: node scripts/check-bridge.mjs compat-core compat-bitrix/plugin
      - run: node scripts/check-lifecycle.mjs compat-core

      - run: node scripts/check-forced-build.mjs compat-core

  bridge-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          repository: smixs/iva-agent
          ref: ae313753a1ae11426d7d0bce90ef8d499c75219a
          path: compat-core
          persist-credentials: false
      - run: npm ci
        working-directory: compat-core
      - uses: actions/checkout@v4
        with:
          repository: mamysh/iva-bitrix24
          ref: 60d690eeb302f951178d255fc687abbce4c020a9
          path: compat-bitrix
          persist-credentials: false
      - run: node scripts/check-bridge.mjs compat-core compat-bitrix/plugin
